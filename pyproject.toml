[project]
name = "battlebelief-workspace"
version = "0.1.0"
description = "Development workspace for BattleBelief"
requires-python = ">=3.12,<3.15"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/battlebelief-core",
  "packages/battlebelief-runtime",
  "packages/battlebelief-lab",
]

[dependency-groups]
dev = [
  "hatchling==1.31.0",
  "jsonschema==4.26.0",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "PyYAML==6.0.3",
  "rfc8785==0.1.4",
  "ruff==0.16.0",
]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers", "--import-mode=importlib"]
testpaths = ["tests", "packages"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["docs"]
src = [
  "packages/battlebelief-core/src",
  "packages/battlebelief-runtime/src",
  "packages/battlebelief-lab/src",
  "tools",
  "tests",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = [
  "packages/battlebelief-core/src",
  "packages/battlebelief-runtime/src",
  "packages/battlebelief-lab/src",
]
files = ["packages"]
exclude = "packages/.*/tests/"
