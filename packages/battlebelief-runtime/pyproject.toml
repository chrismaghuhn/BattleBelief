[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "battlebelief-runtime"
version = "0.2.0"
description = "Public runtime adapters and CLI for BattleBelief"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
authors = [{ name = "BattleBelief contributors" }]
dependencies = [
    "battlebelief-core==0.2.0",
    "websockets==16.1.1",
]

[project.optional-dependencies]
search = [
    "poke-engine @ https://github.com/chrismaghuhn/BattleBelief/releases/download/engine-poke-engine-v0.0.49-bcf13823-v2-legal-choices-r1/poke_engine-0.0.49-cp312-cp312-linux_x86_64.whl#sha256=498c056f0f2e8acb3690f6d6f509c7c4256799fefc952c5212b4757cf33bb6f9 ; implementation_name == 'cpython' and python_version == '3.12' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "poke-engine @ https://github.com/chrismaghuhn/BattleBelief/releases/download/engine-poke-engine-v0.0.49-bcf13823-v2-legal-choices-r1/poke_engine-0.0.49-cp313-cp313-linux_x86_64.whl#sha256=597266fd2cfea5928327d3e2fb23d51b7880f2e7d2527400b56070376710f38e ; implementation_name == 'cpython' and python_version == '3.13' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "poke-engine @ https://github.com/chrismaghuhn/BattleBelief/releases/download/engine-poke-engine-v0.0.49-bcf13823-v2-legal-choices-r1/poke_engine-0.0.49-cp314-cp314-linux_x86_64.whl#sha256=4b4879dae04652fed4139c9bb46903b9011bb09f13a2d3855da8561c92c5da96 ; implementation_name == 'cpython' and python_version == '3.14' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "poke-engine @ https://github.com/chrismaghuhn/BattleBelief/releases/download/engine-poke-engine-v0.0.49-bcf13823-v2-legal-choices-r1/poke_engine-0.0.49-cp312-none-win_amd64.whl#sha256=d9b35f68d896f2183245a1f043ff57236d15ccbec875ad5218bae5aae0a21895 ; implementation_name == 'cpython' and python_version == '3.12' and sys_platform == 'win32' and platform_machine == 'AMD64'",
    "poke-engine @ https://github.com/chrismaghuhn/BattleBelief/releases/download/engine-poke-engine-v0.0.49-bcf13823-v2-legal-choices-r1/poke_engine-0.0.49-cp313-none-win_amd64.whl#sha256=8d0fb2a6d4cf5c2e91901d7024d8efea59c0837cf68dfb488910911971b230c9 ; implementation_name == 'cpython' and python_version == '3.13' and sys_platform == 'win32' and platform_machine == 'AMD64'",
    "poke-engine @ https://github.com/chrismaghuhn/BattleBelief/releases/download/engine-poke-engine-v0.0.49-bcf13823-v2-legal-choices-r1/poke_engine-0.0.49-cp314-none-win_amd64.whl#sha256=5a212d8c93f4919f742a53392fbf9a93be7c00d30521842f212c0b5a195cb3a4 ; implementation_name == 'cpython' and python_version == '3.14' and sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[project.scripts]
battlebelief = "battlebelief_runtime.cli:main"

[tool.uv.sources]
battlebelief-core = { workspace = true }

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/battlebelief_runtime"]

[tool.hatch.build.targets.wheel.force-include]
"tests/fixtures/poke_engine" = "battlebelief_runtime/adapters/poke_engine/fixtures"

[tool.hatch.build.targets.sdist]
include = ["src", "tests/fixtures/poke_engine"]
