[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "battlebelief-runtime"
version = "0.2.0"
description = "Public runtime adapters and CLI for BattleBelief"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
authors = [{ name = "BattleBelief contributors" }]
dependencies = [
    "battlebelief-core==0.2.0",
    "websockets==16.1.1",
]

[project.optional-dependencies]
search = [
    "poke-engine @ https://github.com/chrismaghuhn/BattleBelief/releases/download/engine-poke-engine-v0.0.48-bcf13823-v1/poke_engine-0.0.48-cp312-cp312-linux_x86_64.whl#sha256=2f566d435691873278203e6e13ea0247a4c3d675735d2f9e7117812b32988c84 ; implementation_name == 'cpython' and python_version == '3.12' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "poke-engine @ https://github.com/chrismaghuhn/BattleBelief/releases/download/engine-poke-engine-v0.0.48-bcf13823-v1/poke_engine-0.0.48-cp313-cp313-linux_x86_64.whl#sha256=0426bae7bada0d8ed576bde65381eb726c9bbecd28d59f491b0c4409420f5131 ; implementation_name == 'cpython' and python_version == '3.13' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "poke-engine @ https://github.com/chrismaghuhn/BattleBelief/releases/download/engine-poke-engine-v0.0.48-bcf13823-v1/poke_engine-0.0.48-cp314-cp314-linux_x86_64.whl#sha256=895b44026f5eed78223a37e568e0d426ee7e6e98178abf333298364bca46a8e0 ; implementation_name == 'cpython' and python_version == '3.14' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "poke-engine @ https://github.com/chrismaghuhn/BattleBelief/releases/download/engine-poke-engine-v0.0.48-bcf13823-v1/poke_engine-0.0.48-cp312-none-win_amd64.whl#sha256=0678b467f6109dcbff9612bfdff765a0faab825068e5c456d1250f0aac05c05a ; implementation_name == 'cpython' and python_version == '3.12' and sys_platform == 'win32' and platform_machine == 'AMD64'",
    "poke-engine @ https://github.com/chrismaghuhn/BattleBelief/releases/download/engine-poke-engine-v0.0.48-bcf13823-v1/poke_engine-0.0.48-cp313-none-win_amd64.whl#sha256=8828c4730a70940a09d49d6e5d776f18dddf6b16e726dffdbe86e7499dd5c653 ; implementation_name == 'cpython' and python_version == '3.13' and sys_platform == 'win32' and platform_machine == 'AMD64'",
    "poke-engine @ https://github.com/chrismaghuhn/BattleBelief/releases/download/engine-poke-engine-v0.0.48-bcf13823-v1/poke_engine-0.0.48-cp314-none-win_amd64.whl#sha256=11502307bc5ecd37e351c47317f401a1cdbe50f013c8defbe88262238a74352e ; implementation_name == 'cpython' and python_version == '3.14' and sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[project.scripts]
battlebelief = "battlebelief_runtime.cli:main"

[tool.uv.sources]
battlebelief-core = { workspace = true }

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/battlebelief_runtime"]

[tool.hatch.build.targets.wheel.force-include]
"tests/fixtures/poke_engine" = "battlebelief_runtime/adapters/poke_engine/fixtures"

[tool.hatch.build.targets.sdist]
include = ["src", "tests/fixtures/poke_engine"]
