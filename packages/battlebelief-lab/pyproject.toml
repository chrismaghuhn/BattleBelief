[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "battlebelief-lab"
version = "0.2.0"
description = "Offline research and evaluation tools for BattleBelief"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
authors = [{ name = "BattleBelief contributors" }]
dependencies = [
  "battlebelief-core==0.2.0",
  "battlebelief-runtime==0.2.0",
  "jsonschema[format-nongpl]==4.26.0",
]

[project.scripts]
battlebelief-lab = "battlebelief_lab.cli:main"

[tool.uv.sources]
battlebelief-core = { workspace = true }
battlebelief-runtime = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/battlebelief_lab"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/evaluation/differential-corpus.schema.json" = "battlebelief_lab/differential/schemas/differential-corpus.schema.json"
"schemas/evaluation/differential-fixture.schema.json" = "battlebelief_lab/differential/schemas/differential-fixture.schema.json"
"schemas/evaluation/differential-result.schema.json" = "battlebelief_lab/differential/schemas/differential-result.schema.json"
"schemas/evaluation/capability-qualification.schema.json" = "battlebelief_lab/differential/schemas/capability-qualification.schema.json"

[tool.hatch.build.targets.sdist.force-include]
"../../schemas/evaluation/differential-corpus.schema.json" = "schemas/evaluation/differential-corpus.schema.json"
"../../schemas/evaluation/differential-fixture.schema.json" = "schemas/evaluation/differential-fixture.schema.json"
"../../schemas/evaluation/differential-result.schema.json" = "schemas/evaluation/differential-result.schema.json"
"../../schemas/evaluation/capability-qualification.schema.json" = "schemas/evaluation/capability-qualification.schema.json"
