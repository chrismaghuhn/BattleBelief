name: pull-request

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: quality-py${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install uv==0.12.0
      - name: Sync locked workspace
        run: uv sync --frozen --all-packages --group dev
      - name: Test
        run: uv run pytest
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy
      - name: Repository contracts
        run: |
          uv run python tools/check_versions.py
          uv run python tools/check_architecture.py
          uv run python tools/check_docs.py
          uv run python tools/check_schemas.py
          uv run python tools/validate_m15_registration.py

  package-smoke:
    name: package-smoke-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.14"
          - os: windows-2025
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install uv==0.12.0
      - name: Run isolated wheel smokes
        run: python tools/smoke_packages.py

  oracle-smoke:
    name: oracle-smoke-${{ matrix.os }}-node${{ matrix.node }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: "18.20.8"
            npm: "10.8.2"
            role: comparison
          - os: windows-2025
            node: "18.20.8"
            npm: "10.8.2"
            role: comparison
          - os: ubuntu-24.04
            node: "20.20.2"
            npm: "10.8.2"
            role: comparison
          - os: windows-2025
            node: "20.20.2"
            npm: "10.8.2"
            role: comparison
          - os: ubuntu-24.04
            node: "22.23.2"
            npm: "10.9.8"
            role: candidate
          - os: windows-2025
            node: "22.23.2"
            npm: "10.9.8"
            role: candidate
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out BattleBelief
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up exact Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install uv
        run: python -m pip install uv==0.12.0
      - name: Sync locked workspace
        run: uv sync --frozen --all-packages --group dev
      - name: Resolve exact Node and npm executables
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "ORACLE_NODE=$(command -v node)" >> "$GITHUB_ENV"
          echo "ORACLE_NPM=$(command -v npm)" >> "$GITHUB_ENV"
      - name: Resolve exact Node and npm executables on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "ORACLE_NODE=$((Get-Command node.exe).Source)" >> $env:GITHUB_ENV
          "ORACLE_NPM=$((Get-Command npm.cmd).Source)" >> $env:GITHUB_ENV
      - name: Build and bind the pinned oracle
        run: uv run python tools/build_showdown_oracle.py --source-manifest "schemas/examples/showdown-oracle-source.example.json" --checkout "${{ runner.temp }}/pokemon-showdown" --node "${{ env.ORACLE_NODE }}" --npm "${{ env.ORACLE_NPM }}" --probe-role "${{ matrix.role }}" --npm-cache "${{ runner.temp }}/showdown-npm-cache" --npm-home "${{ runner.temp }}/showdown-npm-home" --output "${{ runner.temp }}/showdown-oracle-build.json"
      - name: Verify the finished build without rebuilding
        run: uv run python tools/build_showdown_oracle.py --source-manifest "schemas/examples/showdown-oracle-source.example.json" --checkout "${{ runner.temp }}/pokemon-showdown" --node "${{ env.ORACLE_NODE }}" --npm "${{ env.ORACLE_NPM }}" --probe-role "${{ matrix.role }}" --npm-cache "${{ runner.temp }}/showdown-npm-cache" --npm-home "${{ runner.temp }}/showdown-npm-home" --output "${{ runner.temp }}/showdown-oracle-build.json" --verify-only
      - name: Run the hermetic oracle smoke twice
        run: |
          uv run python tools/smoke_lab_oracle.py --source-manifest "schemas/examples/showdown-oracle-source.example.json" --build-manifest "${{ runner.temp }}/showdown-oracle-build.json" --checkout "${{ runner.temp }}/pokemon-showdown" --node "${{ env.ORACLE_NODE }}" --npm "${{ env.ORACLE_NPM }}" --fixtures-dir "packages/battlebelief-lab/tests/fixtures/showdown_oracle" > "${{ runner.temp }}/oracle-smoke-1.json"
          uv run python tools/smoke_lab_oracle.py --source-manifest "schemas/examples/showdown-oracle-source.example.json" --build-manifest "${{ runner.temp }}/showdown-oracle-build.json" --checkout "${{ runner.temp }}/pokemon-showdown" --node "${{ env.ORACLE_NODE }}" --npm "${{ env.ORACLE_NPM }}" --fixtures-dir "packages/battlebelief-lab/tests/fixtures/showdown_oracle" > "${{ runner.temp }}/oracle-smoke-2.json"
      - name: Diagnose a rejected Linux oracle checkout
        if: failure() && runner.os != 'Windows'
        shell: bash
        env:
          ORACLE_CHECKOUT: ${{ runner.temp }}/pokemon-showdown
        run: |
          if [[ ! -d "$ORACLE_CHECKOUT/.git" ]]; then
            printf '%s\n' 'oracle_checkout_missing'
            exit 0
          fi
          printf '%s\n' 'tracked_worktree_changes'
          git -C "$ORACLE_CHECKOUT" diff --name-status --no-ext-diff
          printf '%s\n' 'tracked_index_changes'
          git -C "$ORACLE_CHECKOUT" diff --cached --name-status --no-ext-diff
          printf '%s\n' 'non_build_generated_paths'
          git -C "$ORACLE_CHECKOUT" status --porcelain=v1 --ignored --untracked-files=all -- . ':(exclude)node_modules' ':(exclude)dist'
          if [[ -f "$ORACLE_CHECKOUT/logs/.gitindex" ]]; then
            printf 'head_tree='
            git -C "$ORACLE_CHECKOUT" rev-parse 'HEAD^{tree}'
            printf 'generated_tree='
            GIT_INDEX_FILE="$ORACLE_CHECKOUT/logs/.gitindex" git -C "$ORACLE_CHECKOUT" write-tree || printf '%s\n' 'invalid'
            printf '%s\n' 'generated_index_changes'
            GIT_INDEX_FILE="$ORACLE_CHECKOUT/logs/.gitindex" git -C "$ORACLE_CHECKOUT" diff --cached --name-status HEAD
          fi
      - name: Compare and report canonical evidence
        env:
          BUILD_MANIFEST: ${{ runner.temp }}/showdown-oracle-build.json
          ORACLE_SMOKE_ONE: ${{ runner.temp }}/oracle-smoke-1.json
          ORACLE_SMOKE_TWO: ${{ runner.temp }}/oracle-smoke-2.json
          EXPECTED_NPM: ${{ matrix.npm }}
        run: uv run python -c "import hashlib,json,os; from pathlib import Path; one=Path(os.environ['ORACLE_SMOKE_ONE']).read_bytes(); two=Path(os.environ['ORACLE_SMOKE_TWO']).read_bytes(); assert one == two; build=Path(os.environ['BUILD_MANIFEST']).read_bytes(); document=json.loads(build); assert document['npm_version'] == os.environ['EXPECTED_NPM']; print('build_manifest_file_sha256=' + hashlib.sha256(build).hexdigest()); print(one.decode('utf-8').strip())"

  protocol-smoke:
    name: protocol-smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install uv
        run: python -m pip install uv==0.12.0
      - name: Sync locked workspace
        run: uv sync --frozen --all-packages --group dev
      - name: Run protocol smoke
        run: uv run pytest tests/smokes/test_protocol_smoke.py -v

  safety-smoke:
    name: safety-smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install uv
        run: python -m pip install uv==0.12.0
      - name: Sync locked workspace
        run: uv sync --frozen --all-packages --group dev
      - name: Run safety smoke
        run: uv run pytest tests/smokes/test_safety_smoke.py -v

  artifact-build:
    name: engine-build-${{ matrix.os }}-py${{ matrix.python }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: "3.12", python_tag: cp312, abi_tag: cp312, target: x86_64-unknown-linux-gnu, platform_tag: linux_x86_64}
          - {os: ubuntu-24.04, python: "3.13", python_tag: cp313, abi_tag: cp313, target: x86_64-unknown-linux-gnu, platform_tag: linux_x86_64}
          - {os: ubuntu-24.04, python: "3.14", python_tag: cp314, abi_tag: cp314, target: x86_64-unknown-linux-gnu, platform_tag: linux_x86_64}
          - {os: windows-2025, python: "3.12", python_tag: cp312, abi_tag: none, target: x86_64-pc-windows-msvc, platform_tag: win_amd64}
          - {os: windows-2025, python: "3.13", python_tag: cp313, abi_tag: none, target: x86_64-pc-windows-msvc, platform_tag: win_amd64}
          - {os: windows-2025, python: "3.14", python_tag: cp314, abi_tag: none, target: x86_64-pc-windows-msvc, platform_tag: win_amd64}
    runs-on: ${{ matrix.os }}
    env:
      ENGINE_TARGET: ${{ matrix.target }}
      ENGINE_CELL: ${{ matrix.os }}-x86_64-${{ matrix.python_tag }}
    steps:
      - name: Check out BattleBelief
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install exact Python tooling
        run: |
          python -m pip install uv==0.12.0
          uv sync --frozen --all-packages --group dev
          uv venv "${{ runner.temp }}/maturin-env" --python python
          uv pip install --python "${{ runner.temp }}/maturin-env" maturin==1.7.1
      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.83.0 --profile minimal --target "${{ env.ENGINE_TARGET }}"
          rustup default 1.83.0
      - name: Resolve controlled executables on Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "ENGINE_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "ENGINE_RUSTC=$(rustup which --toolchain 1.83.0 rustc)" >> "$GITHUB_ENV"
          echo "ENGINE_CARGO=$(rustup which --toolchain 1.83.0 cargo)" >> "$GITHUB_ENV"
          echo "ENGINE_MATURIN=${RUNNER_TEMP}/maturin-env/bin/maturin" >> "$GITHUB_ENV"
      - name: Resolve controlled executables on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $rustc = (& rustup which --toolchain 1.83.0 rustc).Trim()
          $cargo = (& rustup which --toolchain 1.83.0 cargo).Trim()
          "ENGINE_PYTHON=$((Get-Command python.exe).Source)" >> $env:GITHUB_ENV
          "ENGINE_RUSTC=$rustc" >> $env:GITHUB_ENV
          "ENGINE_CARGO=$cargo" >> $env:GITHUB_ENV
          "ENGINE_MATURIN=$env:RUNNER_TEMP\maturin-env\Scripts\maturin.exe" >> $env:GITHUB_ENV
      - name: Acquire and verify exact upstream source
        run: |
          uv run python tools/build_poke_engine_wheel.py acquire --checkout "${{ runner.temp }}/poke-engine"
          uv run python tools/build_poke_engine_wheel.py verify-source --checkout "${{ runner.temp }}/poke-engine" --source-manifest artifacts/gen9ou/m2/engine/engine-source.json
      - name: Fetch locked Cargo dependencies before the offline build
        shell: pwsh
        env:
          CARGO_HOME: ${{ runner.temp }}/battlebelief-engine-cargo-home
        run: '& "${{ env.ENGINE_CARGO }}" fetch --locked --manifest-path "${{ runner.temp }}/poke-engine/poke-engine-py/Cargo.toml"'
      - name: Build and bind one wheel cell
        id: engine_build
        run: uv run python tools/build_poke_engine_wheel.py build --checkout "${{ runner.temp }}/poke-engine" --source-manifest artifacts/gen9ou/m2/engine/engine-source.json --python "${{ env.ENGINE_PYTHON }}" --rustc "${{ env.ENGINE_RUSTC }}" --cargo "${{ env.ENGINE_CARGO }}" --maturin "${{ env.ENGINE_MATURIN }}" --target "${{ env.ENGINE_TARGET }}" --operating-system "${{ matrix.os }}" --wheelhouse "${{ runner.temp }}/engine-wheel" --output "${{ runner.temp }}/engine-build-${{ env.ENGINE_CELL }}.json"
      - name: Diagnose a failed Maturin build
        if: failure() && steps.engine_build.outcome == 'failure'
        shell: pwsh
        env:
          CARGO_HOME: ${{ runner.temp }}/battlebelief-engine-cargo-home
          CARGO_INCREMENTAL: "false"
          CARGO_NET_OFFLINE: "true"
          CARGO_PROFILE_RELEASE_DEBUG: "0"
          PYTHONUTF8: "1"
          SOURCE_DATE_EPOCH: "1784471591"
        run: |
          $diagnosticArgs = @(
            "build", "--release", "--strip", "--locked",
            "--manifest-path", "${{ runner.temp }}/poke-engine/poke-engine-py/Cargo.toml",
            "--no-default-features",
            "--features", "poke-engine/gen9,poke-engine/terastallization",
            "--interpreter", "${{ env.ENGINE_PYTHON }}",
            "--target", "${{ env.ENGINE_TARGET }}",
            "--out", "${{ runner.temp }}/engine-diagnostic"
          )
          if ("${{ runner.os }}" -ne "Windows") {
            $diagnosticArgs += @("--compatibility", "linux")
          }
          & "${{ env.ENGINE_MATURIN }}" @diagnosticArgs
      - name: Verify the staged wheel without import
        run: uv run python tools/verify_poke_engine_artifact.py --source-manifest artifacts/gen9ou/m2/engine/engine-source.json --build-manifest "${{ runner.temp }}/engine-build-${{ env.ENGINE_CELL }}.json" --wheel "${{ runner.temp }}/engine-wheel/poke_engine-0.0.48-${{ matrix.python_tag }}-${{ matrix.abi_tag }}-${{ matrix.platform_tag }}.whl" --checkout "${{ runner.temp }}/poke-engine"
      - name: Stage the cell artifact
        run: uv run python -c "from pathlib import Path; import shutil; stage=Path(r'${{ runner.temp }}/engine-cell'); stage.mkdir(); shutil.copy2(Path(r'${{ runner.temp }}/engine-build-${{ env.ENGINE_CELL }}.json'), stage); [shutil.copy2(path, stage) for path in Path(r'${{ runner.temp }}/engine-wheel').glob('*.whl')]"
      - name: Upload temporary cell artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-build-${{ env.ENGINE_CELL }}
          path: ${{ runner.temp }}/engine-cell
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  artifact-candidate-index:
    name: engine-candidate-index
    needs: [artifact-build]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out BattleBelief
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install locked tooling
        run: |
          python -m pip install uv==0.12.0
          uv sync --frozen --all-packages --group dev
      - name: Download all cell artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: engine-build-*
          path: ${{ runner.temp }}/engine-builds
          merge-multiple: true
      - name: Create candidate index
        run: uv run python tools/create_engine_artifact_index.py --source-manifest artifacts/gen9ou/m2/engine/engine-source.json --input-root "${{ runner.temp }}/engine-builds" --fixture-root packages/battlebelief-runtime/tests/fixtures/poke_engine --availability-status candidate --output "${{ runner.temp }}/engine-data/engine-artifact-index.json"
      - name: Assemble candidate sidecars
        run: uv run python -c "from pathlib import Path; import shutil; data=Path(r'${{ runner.temp }}/engine-data'); shutil.copy2(Path('artifacts/gen9ou/m2/engine/engine-source.json'), data); [shutil.copy2(path, data) for path in Path(r'${{ runner.temp }}/engine-builds').glob('engine-build-*.json')]"
      - name: Upload candidate index and sidecars
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-candidate-index
          path: ${{ runner.temp }}/engine-data
          if-no-files-found: error
          retention-days: 7

  artifact-stage-sentinel:
    name: engine-stage-sentinel-${{ matrix.os }}-py${{ matrix.python }}
    needs: [artifact-build, artifact-candidate-index]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: "3.12", python_tag: cp312, abi_tag: cp312, platform_tag: linux_x86_64}
          - {os: ubuntu-24.04, python: "3.13", python_tag: cp313, abi_tag: cp313, platform_tag: linux_x86_64}
          - {os: ubuntu-24.04, python: "3.14", python_tag: cp314, abi_tag: cp314, platform_tag: linux_x86_64}
          - {os: windows-2025, python: "3.12", python_tag: cp312, abi_tag: none, platform_tag: win_amd64}
          - {os: windows-2025, python: "3.13", python_tag: cp313, abi_tag: none, platform_tag: win_amd64}
          - {os: windows-2025, python: "3.14", python_tag: cp314, abi_tag: none, platform_tag: win_amd64}
    runs-on: ${{ matrix.os }}
    env:
      ENGINE_CELL: ${{ matrix.os }}-x86_64-${{ matrix.python_tag }}
      ENGINE_WHEEL: poke_engine-0.0.48-${{ matrix.python_tag }}-${{ matrix.abi_tag }}-${{ matrix.platform_tag }}.whl
    steps:
      - name: Check out BattleBelief
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install uv==0.12.0
      - name: Download candidate sidecars
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: engine-candidate-index
          path: ${{ runner.temp }}/engine-data
      - name: Download matching wheel cell
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: engine-build-${{ env.ENGINE_CELL }}
          path: ${{ runner.temp }}/engine-cell
      - name: Build base BattleBelief wheels
        run: |
          uv build packages/battlebelief-core --wheel --out-dir "${{ runner.temp }}/battlebelief-wheels"
          uv build packages/battlebelief-runtime --wheel --out-dir "${{ runner.temp }}/battlebelief-wheels"
      - name: Create isolated sentinel environment
        shell: pwsh
        env:
          BATTLEBELIEF_WHEEL_ROOT: ${{ runner.temp }}/battlebelief-wheels
          ENGINE_WHEEL_PATH: ${{ runner.temp }}/engine-cell/${{ env.ENGINE_WHEEL }}
          SENTINEL_ENV: ${{ runner.temp }}/sentinel-env
        run: |
          $coreWheels = @(Get-ChildItem -LiteralPath $env:BATTLEBELIEF_WHEEL_ROOT -Filter 'battlebelief_core-*.whl' -File)
          $runtimeWheels = @(Get-ChildItem -LiteralPath $env:BATTLEBELIEF_WHEEL_ROOT -Filter 'battlebelief_runtime-*.whl' -File)
          if ($coreWheels.Count -ne 1 -or $runtimeWheels.Count -ne 1) { throw 'BattleBelief wheel closure differs' }
          uv venv $env:SENTINEL_ENV --python python --seed
          uv pip install --python $env:SENTINEL_ENV --only-binary :all: rfc8785==0.1.4
          uv pip install --python $env:SENTINEL_ENV --no-deps $coreWheels[0].FullName $runtimeWheels[0].FullName $env:ENGINE_WHEEL_PATH
      - name: Resolve isolated Python on Linux
        if: runner.os != 'Windows'
        shell: bash
        run: echo "SENTINEL_PYTHON=${RUNNER_TEMP}/sentinel-env/bin/python" >> "$GITHUB_ENV"
      - name: Resolve isolated Python on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "SENTINEL_PYTHON=$env:RUNNER_TEMP\sentinel-env\Scripts\python.exe" >> $env:GITHUB_ENV
      - name: Run real staged native sentinel
        shell: pwsh
        run: '& "${{ env.SENTINEL_PYTHON }}" tools/smoke_gen9_engine.py --data-root "${{ runner.temp }}/engine-data" --fixture-root packages/battlebelief-runtime/tests/fixtures/poke_engine --staged-wheel "${{ runner.temp }}/engine-cell/${{ env.ENGINE_WHEEL }}" --output "${{ runner.temp }}/sentinel-${{ env.ENGINE_CELL }}.json"'
      - name: Upload sentinel evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-sentinel-${{ env.ENGINE_CELL }}
          path: ${{ runner.temp }}/sentinel-${{ env.ENGINE_CELL }}.json
          if-no-files-found: error
          retention-days: 7

  artifact-index:
    name: engine-artifact-index-closure
    needs: [artifact-build, artifact-stage-sentinel]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out BattleBelief
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install locked tooling
        run: |
          python -m pip install uv==0.12.0
          uv sync --frozen --all-packages --group dev
      - name: Download all cell artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: engine-build-*
          path: ${{ runner.temp }}/engine-builds
          merge-multiple: true
      - name: Download all sentinel evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: engine-sentinel-*
          path: ${{ runner.temp }}/engine-evidence
          merge-multiple: true
      - name: Create available artifact index
        run: uv run python tools/create_engine_artifact_index.py --source-manifest artifacts/gen9ou/m2/engine/engine-source.json --input-root "${{ runner.temp }}/engine-builds" --fixture-root packages/battlebelief-runtime/tests/fixtures/poke_engine --availability-status available --evidence-root "${{ runner.temp }}/engine-evidence" --output "${{ runner.temp }}/publication/engine-artifact-index.json"
      - name: Acquire the bound license
        run: |
          uv run python tools/build_poke_engine_wheel.py acquire --checkout "${{ runner.temp }}/poke-engine"
          uv run python tools/build_poke_engine_wheel.py verify-source --checkout "${{ runner.temp }}/poke-engine" --source-manifest artifacts/gen9ou/m2/engine/engine-source.json
      - name: Assemble publication bundle and checksums
        run: uv run python -c "from pathlib import Path; import hashlib,shutil; bundle=Path(r'${{ runner.temp }}/publication'); builds=Path(r'${{ runner.temp }}/engine-builds'); shutil.copy2(Path('artifacts/gen9ou/m2/engine/engine-source.json'), bundle); shutil.copy2(Path(r'${{ runner.temp }}/poke-engine/LICENSE'), bundle/'poke-engine-LICENSE-MIT.txt'); [shutil.copy2(path, bundle) for path in builds.iterdir()]; assets=sorted(path for path in bundle.iterdir() if path.is_file()); assert len(assets)==15; lines=[f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}' for path in assets]; (bundle/'SHA256SUMS').write_text('\n'.join(lines)+'\n', encoding='ascii')"
      - name: Validate available index schema
        run: uv run python -c "import json; from pathlib import Path; from jsonschema import Draft202012Validator,FormatChecker; root=Path('.'); schema=json.loads((root/'schemas/manifests/engine-artifact-index.schema.json').read_bytes()); value=json.loads(Path(r'${{ runner.temp }}/publication/engine-artifact-index.json').read_bytes()); errors=list(Draft202012Validator(schema,format_checker=FormatChecker()).iter_errors(value)); assert not errors, errors"
      - name: Compare committed staging manifests when present
        shell: bash
        run: |
          committed=artifacts/gen9ou/m2/engine/engine-artifact-index.json
          if [[ -f "$committed" ]]; then
            cmp "$committed" "${RUNNER_TEMP}/publication/engine-artifact-index.json"
            for manifest in "${RUNNER_TEMP}"/publication/engine-build-*.json; do
              cmp "artifacts/gen9ou/m2/engine/$(basename "$manifest")" "$manifest"
            done
          fi
      - name: Upload publication bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-publication-bundle
          path: ${{ runner.temp }}/publication
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  runtime-search-smoke:
    name: runtime-search-smoke-${{ matrix.os }}-py${{ matrix.python }}
    needs: [artifact-index]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: "3.12"}
          - {os: ubuntu-24.04, python: "3.13"}
          - {os: ubuntu-24.04, python: "3.14"}
          - {os: windows-2025, python: "3.12"}
          - {os: windows-2025, python: "3.13"}
          - {os: windows-2025, python: "3.14"}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out BattleBelief
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install uv==0.12.0
      - name: Build base BattleBelief wheels
        run: |
          uv build packages/battlebelief-core --wheel --out-dir "${{ runner.temp }}/battlebelief-wheels"
          uv build packages/battlebelief-runtime --wheel --out-dir "${{ runner.temp }}/battlebelief-wheels"
      - name: Create isolated Runtime search environment
        shell: pwsh
        env:
          BATTLEBELIEF_WHEEL_ROOT: ${{ runner.temp }}/battlebelief-wheels
          SEARCH_ENV: ${{ runner.temp }}/runtime-search-env
        run: |
          $coreWheels = @(Get-ChildItem -LiteralPath $env:BATTLEBELIEF_WHEEL_ROOT -Filter 'battlebelief_core-*.whl' -File)
          $runtimeWheels = @(Get-ChildItem -LiteralPath $env:BATTLEBELIEF_WHEEL_ROOT -Filter 'battlebelief_runtime-*.whl' -File)
          if ($coreWheels.Count -ne 1 -or $runtimeWheels.Count -ne 1) { throw 'BattleBelief wheel closure differs' }
          $runtimeRequirement = $runtimeWheels[0].FullName + '[search]'
          uv venv $env:SEARCH_ENV --python python --seed
          $searchPython = if ($env:RUNNER_OS -eq 'Windows') {
            Join-Path $env:SEARCH_ENV 'Scripts/python.exe'
          } else {
            Join-Path $env:SEARCH_ENV 'bin/python'
          }
          & $searchPython -m pip install --disable-pip-version-check --no-compile --only-binary=:all: $coreWheels[0].FullName $runtimeRequirement
          if ($LASTEXITCODE -ne 0) { throw 'Runtime search installation failed' }
      - name: Resolve isolated Python on Linux
        if: runner.os != 'Windows'
        shell: bash
        run: echo "SEARCH_PYTHON=${RUNNER_TEMP}/runtime-search-env/bin/python" >> "$GITHUB_ENV"
      - name: Resolve isolated Python on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "SEARCH_PYTHON=$env:RUNNER_TEMP\runtime-search-env\Scripts\python.exe" >> $env:GITHUB_ENV
      - name: Run published Runtime search sentinel twice
        shell: pwsh
        run: |
          $sentinel = "import json,sys; from pathlib import Path; from battlebelief_runtime.public_api import run_gen9_sentinel; availability=run_gen9_sentinel(); assert availability.status == 'available', availability.to_dict(); Path(sys.argv[1]).write_text(json.dumps(availability.to_dict(), sort_keys=True, separators=(',', ':')) + '\n', encoding='utf-8', newline='\n')"
          & "${{ env.SEARCH_PYTHON }}" -c $sentinel "${{ runner.temp }}/runtime-search-sentinel-1.json"
          if ($LASTEXITCODE -ne 0) { throw 'First Runtime search sentinel failed' }
          & "${{ env.SEARCH_PYTHON }}" -c $sentinel "${{ runner.temp }}/runtime-search-sentinel-2.json"
          if ($LASTEXITCODE -ne 0) { throw 'Second Runtime search sentinel failed' }
          & "${{ env.SEARCH_PYTHON }}" -c "from pathlib import Path; assert Path(r'${{ runner.temp }}/runtime-search-sentinel-1.json').read_bytes() == Path(r'${{ runner.temp }}/runtime-search-sentinel-2.json').read_bytes()"
          if ($LASTEXITCODE -ne 0) { throw 'Runtime search sentinel evidence differs' }

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0

  pr-gate:
    name: pr-gate
    if: always()
    needs:
      - quality
      - package-smoke
      - oracle-smoke
      - dependency-review
      - protocol-smoke
      - safety-smoke
      - artifact-build
      - artifact-candidate-index
      - artifact-stage-sentinel
      - artifact-index
      - runtime-search-smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Evaluate required jobs
        env:
          QUALITY: ${{ needs.quality.result }}
          PACKAGE_SMOKE: ${{ needs.package-smoke.result }}
          ORACLE_SMOKE: ${{ needs['oracle-smoke'].result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
          PROTOCOL_SMOKE: ${{ needs['protocol-smoke'].result }}
          SAFETY_SMOKE: ${{ needs['safety-smoke'].result }}
          ARTIFACT_BUILD: ${{ needs['artifact-build'].result }}
          ARTIFACT_CANDIDATE_INDEX: ${{ needs['artifact-candidate-index'].result }}
          ARTIFACT_STAGE_SENTINEL: ${{ needs['artifact-stage-sentinel'].result }}
          ARTIFACT_INDEX: ${{ needs['artifact-index'].result }}
          RUNTIME_SEARCH_SMOKE: ${{ needs['runtime-search-smoke'].result }}
        shell: bash
        run: |
          for result in "$QUALITY" "$PACKAGE_SMOKE" "$ORACLE_SMOKE" "$DEPENDENCY_REVIEW" "$PROTOCOL_SMOKE" "$SAFETY_SMOKE" "$ARTIFACT_BUILD" "$ARTIFACT_CANDIDATE_INDEX" "$ARTIFACT_STAGE_SENTINEL" "$ARTIFACT_INDEX" "$RUNTIME_SEARCH_SMOKE"; do
            case "$result" in
              success|skipped) ;;
              *) echo "Required job result: $result"; exit 1 ;;
            esac
          done
